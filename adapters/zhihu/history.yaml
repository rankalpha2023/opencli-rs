site: zhihu
name: history
description: 我的阅读历史
domain: www.zhihu.com
strategy: cookie
browser: true

args:
  limit:
    type: int
    default: 20
    description: 返回数量
  offset:
    type: int
    default: 0
    description: 偏移量

pipeline:
  - navigate: https://www.zhihu.com

  - evaluate: |
      (async () => {
        const limit = ${{ args.limit }};
        const offset = ${{ args.offset }};
        const res = await fetch('/api/v4/unify-consumption/read_history?offset=' + offset + '&limit=' + limit, {
          credentials: 'include'
        });
        const data = await res.json();
        return (data.data || []).map(item => ({
          title: item.data?.header?.title || '',
          summary: item.data?.content?.summary || '',
          url: item.data?.action?.url || '',
          author: item.data?.content?.author_name || '',
          likes: item.data?.matrix?.[0]?.data?.text || ''
        }));
      })()

  - map:
      title: ${{ item.title }}
      summary: ${{ item.summary }}
      url: ${{ item.url }}
      author: ${{ item.author }}
      likes: ${{ item.likes }}

  - limit: ${{ args.limit }}

columns: [title, summary, author, likes]
