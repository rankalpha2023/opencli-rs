site: zhihu
name: author
description: 知乎作者主页
domain: www.zhihu.com

args:
  author:
    positional: true
    type: str
    required: true
    description: Author url_token
  limit:
    type: int
    default: 10
    description: Number of results

pipeline:
  - navigate: https://www.zhihu.com/people/${{ args.author }}

  - evaluate: |
      (async () => {
        const author = ${{ args.author | json }};
        const limit = ${{ args.limit }};
        const res = await fetch('https://www.zhihu.com/api/v3/moments/' + author + '/activities?limit=' + limit + '&desktop=true', {
          credentials: 'include'
        });
        const d = await res.json();
        const formatDate = (ts) => {
          if (!ts) return '';
          const d = new Date(ts * 1000);
          return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
        };
        return (d?.data || [])
          .filter(item => item.target)
          .map(item => {
            const t = item.target;
            return {
              title: t.title || '',
              excerpt: (t.excerpt || '').substring(0, 100),
              url: t.url || '',
              voteup_count: t.voteup_count || 0,
              created: formatDate(t.created || item.created_time),
              updated: formatDate(t.updated),
              type: t.type || '',
            };
          });
      })()

  - map:
      rank: ${{ index + 1 }}
      url: ${{ item.url }}
      title: ${{ item.title }}
      excerpt: ${{ item.excerpt }}
      votes: ${{ item.voteup_count }}
      created: ${{ item.created }}
      type: ${{ item.type }}

  - limit: ${{ args.limit }}

columns: [rank, url, title, excerpt, votes, created, type]
