site: zhihu
name: collections
description: 获取指定作者的收藏夹列表
domain: www.zhihu.com
strategy: cookie
browser: true

args:
  author:
    positional: true
    type: str
    required: true
    description: Author url_token
  limit:
    type: int
    default: 20
    description: Number of collections to return
  offset:
    type: int
    default: 0
    description: Offset of results

pipeline:
  - navigate: https://www.zhihu.com/people/${{ args.author }}/collections

  - evaluate: |
      (async () => {
        const author = ${{ args.author | json }};
        const limit = ${{ args.limit }};
        const offset = ${{ args.offset }};
        const include = 'data%5B*%5D.updated_time%2Canswer_count%2Cfollower_count%2Ccreator%2Cdescription%2Cis_following%2Ccomment_count%2Ccreated_time%3Bdata%5B*%5D.creator.kvip_info%3Bdata%5B*%5D.creator.vip_info';
        const res = await fetch('https://www.zhihu.com/api/v4/people/' + author + '/collections?include=' + include + '&offset=' + offset + '&limit=' + limit, {
          credentials: 'include'
        });
        const d = await res.json();
        const formatDate = (ts) => {
          if (!ts) return '';
          const d = new Date(ts * 1000);
          return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
        };
        return (d?.data || []).map(item => {
          return {
            id: item.id || '',
            title: item.title || '',
            item_count: item.item_count || 0,
            answer_count: item.answer_count || 0,
            view_count: item.view_count || 0,
            description: (item.description || '').substring(0, 100),
            created: formatDate(item.created_time),
            updated: formatDate(item.updated_time),
            url: 'https://www.zhihu.com/collection/' + item.id,
          };
        });
      })()

  - map:
      id: ${{ item.id }}
      title: ${{ item.title }}
      items: ${{ item.item_count }}
      answers: ${{ item.answer_count }}
      views: ${{ item.view_count }}
      created: ${{ item.created }}
      updated: ${{ item.updated }}
      url: ${{ item.url }}

  - limit: ${{ args.limit }}

columns: [id, title, items, answers, views, created, updated]
