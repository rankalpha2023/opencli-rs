site: zhihu
name: collection
description: 获取指定收藏夹的内容
domain: www.zhihu.com
strategy: cookie
browser: true

args:
  collection_id:
    positional: true
    type: str
    required: true
    description: Collection ID
  limit:
    type: int
    default: 20
    description: Number of items to return
  offset:
    type: int
    default: 0
    description: Offset of results

pipeline:
  - navigate: https://www.zhihu.com/collection/${{ args.collection_id }}

  - evaluate: |
      (async () => {
        const collectionId = ${{ args.collection_id | json }};
        const limit = ${{ args.limit }};
        const offset = ${{ args.offset }};
        const res = await fetch('https://www.zhihu.com/api/v4/collections/' + collectionId + '/items?offset=' + offset + '&limit=' + limit, {
          credentials: 'include'
        });
        const d = await res.json();
        const formatDate = (ts) => {
          if (!ts) return '';
          const d = new Date(ts * 1000);
          return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
        };
        return (d?.data || []).map(item => {
          const content = item.content || {};
          return {
            id: content.id || '',
            title: content.title || '',
            excerpt_title: (content.excerpt_title || '').substring(0, 200),
            url: content.url || '',
            created: formatDate(content.created),
            updated: formatDate(content.updated),
          };
        });
      })()

  - map:
      id: ${{ item.id }}
      title: ${{ item.title }}
      excerpt: ${{ item.excerpt_title }}
      url: ${{ item.url }}
      created: ${{ item.created }}
      updated: ${{ item.updated }}

  - limit: ${{ args.limit }}

columns: [id, title, excerpt, url, created, updated]
